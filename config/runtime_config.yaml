event_queue_max_size: 10000
reconciliation_interval_seconds: 60
option_quote_sample_interval_seconds: 1
# Entry opportunity scan cadence (§26A — preserve baseline; do not reduce globally).
# Scalp v3.0 — faster opportunity scan (was 10s).
scan_interval_seconds: 5
# Entry decisions: periodic timer only (matches honest backtest). Quotes still update LTP/OI.
entry_scan_on_quote: false
# Keep in-progress spot 1m bar updated from WS/REST LTP between minute candle fetches
# (aligns live FeatureEngine with day_backtest forming-M1 path).
forming_m1_from_quotes: true
# Throttle forming-M1 updates so every WS tick does not twitch structure features.
forming_m1_min_interval_seconds: 5
# Warmup gate — same floors as day_backtest (skip thin early-session scans).
min_m1_bars_for_entry: 20
min_m3_bars_for_entry: 5
# Before validate: force-fetch candidate option 1m if band cache is thin.
force_fetch_candidate_option_m1: true
min_option_m1_bars_for_chart: 5
# Option mark (mid/EMA) was causing buy/sell fills to diverge from traded LTP.
# Fills and sizing use raw LTP only; leave disabled unless debugging WS noise.
option_mark:
  enabled: false
  prefer_mid: false
  ema_alpha: 0.35
# Reject entry if the option quote is older than this (seconds). 0 = no age gate.
entry_max_quote_age_seconds: 2
# Live exit evaluation cadence — 1s so 2-tick trail confirm reacts quickly.
exit_eval_interval_seconds: 1
# Backtest only: mark exits this often (live uses exit_eval_interval_seconds).
backtest_exit_interval_seconds: 1
# Live: sync Flattrade holdings + margin into algo state (seconds).
rest_quote_poll_interval_seconds: 30
rest_index_poll_interval_seconds: 10
rest_quote_poll_interval_market_seconds: 2
rest_quote_poll_interval_ws_backup_seconds: 15
# When a holding gets no WS tick for this long, REST poll that token (1s loop).
holding_ws_stale_seconds: 3
holding_rest_poll_seconds: 1
# Still no valid LTP after this many seconds → flatten the holding.
holding_stale_flatten_seconds: 20
watchlist_stream_interval_ms: 500
# REST backup for option-chain LTP/OI when WebSocket is thin.
chain_rest_poll_seconds: 8
# Poll individual chain tokens when no WS tick for this many seconds.
option_ws_stale_seconds: 1.5
option_stale_poll_batch: 12

# Daily archive + purge for log tables (keeps DB small).
# Rows older than keep_days (IST) are written to archive_dir then deleted.
log_retention:
  enabled: true
  keep_days: 3
  run_at_ist: "15:35"
  archive_dir: ./data/archives
  tables:
    - system_events
    - notifications
    - field_availability_log
