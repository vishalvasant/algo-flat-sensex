# NIFTY 50 weekly index options (Upstox)
# Decision flow: NIFTY cash (levels) → NIFTY FUT (VWAP/momentum/candles) → options.
# Candles/VWAP/momentum use NIFTY FUT; PDH/PDL/level proximity use NSE NIFTY 50 cash.
underlying: NIFTY
price_source: futures
exchange_spot: NFO
exchange_options: NFO
spot_token: ""
expiry_type: weekly
atm_strike_steps: 5
strike_band_points: 250
strike_step: 50
tradable_strike: ATM
instrument_filter: OPTIDX

underlyings:
  - symbol: NIFTY
    display_name: NIFTY 50
    price_source: futures
    exchange_futures: NFO
    exchange_spot: NFO
    exchange_options: NFO
    index_spot_exchange: NSE
    index_spot_token: "26000"
    spot_token: ""
    strike_step: 50
    strike_band_points: 250
    atm_strike_steps: 5
    tick_size: 0.05
    fallback_spot: 24000

# Display-only index tickers (no option chain) — live LTP on top bar.
index_tickers:
  - symbol: INDIAVIX
    display_name: INDIA VIX
    exchange: NSE
    spot_token: "India VIX"
    fallback_spot: 13.0

