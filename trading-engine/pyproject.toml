[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "algoflat-sensex-trading-engine"
version = "0.1.0"
description = "Algo-Flat Sensex intraday options trading engine"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "asyncpg>=0.29",
    "httpx>=0.27",
    "websockets>=12.0",
    "protobuf>=5.0",
    "structlog>=24.1",
    "NorenRestApiPy>=0.0.22",
    "requests>=2.31",
    "websocket-client>=1.8",
    "httpx>=0.27",
    "pyotp>=2.9",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]
historical = [
    "nse-archives>=1.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.package-data]
algoflat = ["py.typed"]
